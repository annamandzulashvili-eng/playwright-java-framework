name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full regression on all engines, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [smoke, regression, api, ui]
        default: regression
      browser:
        description: Browser for UI tests
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PRs get the fast smoke set; main, schedule and manual runs get regression.
  SUITE: ${{ inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'regression') }}
  # Retries are off locally; one retry in CI absorbs network noise of a public demo site.
  RETRY_MAX: "1"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API tests
        # The API group is small and fast, so it always runs in full
        run: mvn -B -ntp verify -Dsuite=api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium","firefox","webkit"]' || format('["{0}"]', inputs.browser || 'chromium')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pom.xml') }}
      - name: Install browser and OS dependencies
        run: >
          mvn -B -ntp -q exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps ${{ matrix.browser }}"
      - name: Run UI tests
        run: mvn -B -ntp verify -Dsuite=${{ env.SUITE == 'smoke' && 'ui-smoke' || 'ui' }} -Dbrowser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: target/artifacts
          retention-days: 7

  report:
    name: Publish Allure report
    needs: [api, ui]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate report
        run: npx --yes allure-commandline@2.29.0 generate allure-results --clean -o allure-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v4
