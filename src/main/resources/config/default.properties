# Defaults for every environment.
# Override any key with -Dkey=value or an environment variable (dots -> underscores, upper case):
#   mvn verify -Dbrowser=firefox -Dheadless=false
#   BROWSER=webkit TRACE=on mvn verify
env=prod

# --- Browser ---
# chromium | chrome | msedge | firefox | webkit
browser=chromium
headless=true
slowmo.ms=0
# desktop | laptop | tablet | iphone_14 | pixel_7  (emulation, not real devices)
device=desktop
# Attribute used by page.getByTestId(...)
testid.attribute=data-qa

# --- Timeouts ---
timeout.default.ms=15000
timeout.navigation.ms=30000
timeout.assertion.ms=10000
api.timeout.ms=20000

# --- Evidence ---
# off | on | retain_on_failure
trace=retain_on_failure
video=off
screenshot.on.failure=true
artifacts.dir=target/artifacts

# Block ad / analytics / consent scripts (faster, stable runs on public demo sites)
block.third.party=true

# --- Execution ---
# 0 = keep thread-count from the suite XML
threads=0
# Opt-in retries for tests annotated with retryAnalyzer = RetryAnalyzer.class
retry.max=0
