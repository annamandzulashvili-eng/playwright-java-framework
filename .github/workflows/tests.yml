name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full regression on all engines, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [smoke, regression, api, ui]
        default: regression
      browser:
        description: Browser for UI tests
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PRs get the fast smoke set; main, schedule and manual runs get regression.
  SUITE: ${{ inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'regression') }}
  # Retries are off locally; one retry in CI absorbs network noise of a public demo site.
  RETRY_MAX: "1"

jobs:
  ai-config:
    name: Validate AI config and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema==4.23.0 pyyaml==6.0.2
      - run: python scripts/validate_ai_config.py

  qase-run:
    name: Open Qase run
    # Enabled with the repository variable QASE_REPORTING=true. PRs never write to Qase.
    if: vars.QASE_REPORTING == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.open.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - id: open
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT: ${{ vars.QASE_PROJECT }}
        run: |
          id=$(bash scripts/qase-run.sh create "CI ${{ github.event_name }} #${{ github.run_number }} (${{ env.SUITE }})")
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "Qase run: https://app.qase.io/run/${QASE_PROJECT}/dashboard/${id}" >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API tests
    needs: qase-run
    if: ${{ !cancelled() }}
    env:
      QASE_MODE: ${{ needs.qase-run.outputs.run_id && 'testops' || 'off' }}
      QASE_TESTOPS_RUN_ID: ${{ needs.qase-run.outputs.run_id }}
      QASE_TESTOPS_API_TOKEN: ${{ needs.qase-run.outputs.run_id && secrets.QASE_API_TOKEN || '' }}
      QASE_TESTOPS_PROJECT: ${{ vars.QASE_PROJECT }}
      QASE_TESTOPS_RUN_COMPLETE: "false"
      QASE_FALLBACK: "off"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API tests
        # The API group is small and fast, so it always runs in full
        run: mvn -B -ntp verify -Dsuite=api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.browser }})
    needs: qase-run
    if: ${{ !cancelled() }}
    env:
      QASE_MODE: ${{ needs.qase-run.outputs.run_id && 'testops' || 'off' }}
      QASE_TESTOPS_RUN_ID: ${{ needs.qase-run.outputs.run_id }}
      QASE_TESTOPS_API_TOKEN: ${{ needs.qase-run.outputs.run_id && secrets.QASE_API_TOKEN || '' }}
      QASE_TESTOPS_PROJECT: ${{ vars.QASE_PROJECT }}
      QASE_TESTOPS_RUN_COMPLETE: "false"
      QASE_FALLBACK: "off"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium","firefox","webkit"]' || format('["{0}"]', inputs.browser || 'chromium')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pom.xml') }}
      - name: Install browser and OS dependencies
        run: >
          mvn -B -ntp -q exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps ${{ matrix.browser }}"
      - name: Run UI tests
        run: mvn -B -ntp verify -Dsuite=${{ env.SUITE == 'smoke' && 'ui-smoke' || 'ui' }} -Dbrowser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: target/artifacts
          retention-days: 7

  qase-complete:
    name: Complete Qase run
    needs: [qase-run, api, ui]
    if: always() && needs.qase-run.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT: ${{ vars.QASE_PROJECT }}
        run: bash scripts/qase-run.sh complete "${{ needs.qase-run.outputs.run_id }}"

  report:
    name: Publish Allure report
    needs: [api, ui]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check GitHub Pages is enabled
        uses: actions/configure-pages@v6
      - name: Generate report
        run: npx --yes allure-commandline@2.29.0 generate allure-results --clean -o allure-report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v5
